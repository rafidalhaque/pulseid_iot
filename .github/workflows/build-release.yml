name: Build & Release ESP32 Firmware

on:
  push:
    branches: 
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformiox
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Get firmware version
        id: ext_version
        run: |
          VERSION=$(grep "version" platformio.ini | head -1 | awk -F= '{print $2}' | tr -d ' ')
          echo "VERSION_NAME=$VERSION" >> $GITHUB_OUTPUT

      - name: Build firmware
        run: pio run
      - name: Get latest commit message
        id: commit_msg
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "$MSG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: .pio/build/esp32dev/firmware.bin
          tag_name: v${{ steps.ext_version.outputs.VERSION_NAME }}
          name: Release v${{ steps.ext_version.outputs.VERSION_NAME }}
          body: ${{ env.RELEASE_BODY }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload firmware to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_BODY: ${{ env.RELEASE_BODY }}
        run: |
          set -euo pipefail
          CAPTION_FILE="$(mktemp)"
          trap 'rm -f "$CAPTION_FILE"' EXIT
          printf 'Release v${{ steps.ext_version.outputs.VERSION_NAME }}\n\n%s' "$RELEASE_BODY" > "$CAPTION_FILE"
          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@.pio/build/esp32dev/firmware.bin" \
            -F "caption=<$CAPTION_FILE"

      - name: Upload Firmware to Backend
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
        run: |
          set -euo pipefail
          
          VERSION_CODE=0
          VERSION_NAME=${{ steps.ext_version.outputs.VERSION_NAME }}
          
          echo "Uploading v$VERSION_NAME ($VERSION_CODE) to backend..."
          
          curl --fail \
            -H "X-RELEASE-KEY: $RELEASE_KEY" \
            -F "released_file=@.pio/build/esp32dev/firmware.bin" \
            -F "platform=firmware" \
            -F "version_code=$VERSION_CODE" \
            -F "version_name=$VERSION_NAME" \
            https://pulseid.teamsabily.online/api/app/release